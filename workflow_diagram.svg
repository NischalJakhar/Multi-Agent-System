<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="720" fill="#ffffff"/>
  <text x="670" y="24" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Munder Difflin Multi-Agent System — Workflow Diagram</text>

  <!-- Customer Request -->
  <rect x="30" y="45" width="280" height="60" rx="8" fill="#eef4fb" stroke="#2f6fb3" stroke-width="1.5"/>
  <text x="170" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#14324f">Customer Request</text>
  <text x="170" y="88" text-anchor="middle" font-size="11" fill="#14324f">item request + date</text>

  <!-- Orchestrator Agent -->
  <rect x="500" y="40" width="340" height="90" rx="10" fill="#fdf1de" stroke="#c9821a" stroke-width="2"/>
  <text x="670" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#5c3d0a">Orchestrator Agent</text>
  <text x="670" y="79" text-anchor="middle" font-size="11" fill="#5c3d0a">(smolagents CodeAgent)</text>
  <text x="670" y="95" text-anchor="middle" font-size="10.5" fill="#5c3d0a">Delegates to workers, aggregates results,</text>
  <text x="670" y="109" text-anchor="middle" font-size="10.5" fill="#5c3d0a">composes final customer-facing response</text>

  <!-- Customer Response -->
  <rect x="1030" y="45" width="280" height="60" rx="8" fill="#eef4fb" stroke="#2f6fb3" stroke-width="1.5"/>
  <text x="1170" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#14324f">Customer Response</text>
  <text x="1170" y="88" text-anchor="middle" font-size="11" fill="#14324f">fulfilled items, price + rationale</text>

  <!-- top arrows -->
  <line x1="310" y1="75" x2="495" y2="75" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="845" y1="75" x2="1025" y2="75" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Worker agent boxes -->
  <!-- Inventory -->
  <rect x="30" y="230" width="400" height="90" rx="10" fill="#e9f6ee" stroke="#2f9e5c" stroke-width="1.8"/>
  <text x="230" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#154a2c">Inventory Agent</text>
  <text x="230" y="269" text-anchor="middle" font-size="11" fill="#154a2c">(ToolCallingAgent)</text>
  <text x="230" y="285" text-anchor="middle" font-size="10.5" fill="#154a2c">Checks stock levels and estimates</text>
  <text x="230" y="299" text-anchor="middle" font-size="10.5" fill="#154a2c">restock delivery dates vs. requested date</text>

  <!-- Quoting -->
  <rect x="470" y="230" width="400" height="90" rx="10" fill="#f3ecfb" stroke="#7c4dbd" stroke-width="1.8"/>
  <text x="670" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#3d2463">Quoting Agent</text>
  <text x="670" y="269" text-anchor="middle" font-size="11" fill="#3d2463">(ToolCallingAgent)</text>
  <text x="670" y="285" text-anchor="middle" font-size="10.5" fill="#3d2463">Matches items to catalog, applies bulk</text>
  <text x="670" y="299" text-anchor="middle" font-size="10.5" fill="#3d2463">discounts, references quote history</text>

  <!-- Ordering -->
  <rect x="910" y="230" width="400" height="90" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="1110" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#5c1712">Ordering Agent</text>
  <text x="1110" y="269" text-anchor="middle" font-size="11" fill="#5c1712">(ToolCallingAgent)</text>
  <text x="1110" y="285" text-anchor="middle" font-size="10.5" fill="#5c1712">Checks cash, places supplier restocks,</text>
  <text x="1110" y="299" text-anchor="middle" font-size="10.5" fill="#5c1712">and finalizes sales transactions</text>

  <!-- delegate/result arrows orchestrator <-> workers -->
  <path d="M 590 130 C 500 175, 320 190, 235 228" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="670" y1="130" x2="670" y2="228" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M 750 130 C 840 175, 1020 190, 1105 228" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="670" y="180" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">delegate task / return result</text>

  <!-- Tools boxes -->
  <rect x="30" y="345" width="400" height="150" rx="8" fill="#ffffff" stroke="#2f9e5c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="45" y="365" font-size="11.5" font-weight="700" fill="#154a2c">Tools  →  wrapped helper function</text>
  <text x="45" y="385" font-size="11" fill="#154a2c">check_item_stock  →  get_stock_level()</text>
  <text x="45" y="405" font-size="11" fill="#154a2c">check_full_inventory  →  get_all_inventory()</text>
  <text x="45" y="425" font-size="11" fill="#154a2c">estimate_delivery_date  →  get_supplier_delivery_date()</text>

  <rect x="470" y="345" width="400" height="150" rx="8" fill="#ffffff" stroke="#7c4dbd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="485" y="365" font-size="11.5" font-weight="700" fill="#3d2463">Tools  →  wrapped helper function</text>
  <text x="485" y="385" font-size="11" fill="#3d2463">get_item_catalog  →  paper_supplies (catalog)</text>
  <text x="485" y="405" font-size="11" fill="#3d2463">get_quote_history  →  search_quote_history()</text>
  <text x="485" y="425" font-size="11" fill="#3d2463">calculate_bulk_price  →  tiered discount logic</text>

  <rect x="910" y="345" width="400" height="150" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="925" y="365" font-size="11.5" font-weight="700" fill="#5c1712">Tools  →  wrapped helper function</text>
  <text x="925" y="385" font-size="11" fill="#5c1712">check_cash_balance  →  get_cash_balance()</text>
  <text x="925" y="405" font-size="11" fill="#5c1712">get_financial_report  →  generate_financial_report()</text>
  <text x="925" y="425" font-size="11" fill="#5c1712">place_stock_order  →  create_transaction() [stock_orders]</text>
  <text x="925" y="445" font-size="11" fill="#5c1712">finalize_sale  →  create_transaction() [sales]</text>

  <!-- connectors agent -> tools -->
  <line x1="230" y1="320" x2="230" y2="345" stroke="#2f9e5c" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="670" y1="320" x2="670" y2="345" stroke="#7c4dbd" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="1110" y1="320" x2="1110" y2="345" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Database -->
  <rect x="380" y="600" width="580" height="70" rx="10" fill="#f1f1f1" stroke="#555555" stroke-width="1.8"/>
  <text x="670" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#222222">SQLite Database (munder_difflin.db)</text>
  <text x="670" y="642" text-anchor="middle" font-size="10.5" fill="#222222">tables: transactions · inventory · quotes · quote_requests</text>

  <!-- tools -> db arrows -->
  <path d="M 230 495 C 230 560, 400 590, 480 600" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="670" y1="495" x2="670" y2="600" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <path d="M 1110 495 C 1110 560, 940 590, 860 600" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <rect x="30" y="600" width="300" height="70" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="45" y="618" font-size="11" font-weight="700" fill="#222222">Legend</text>
  <line x1="45" y1="632" x2="80" y2="632" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="88" y="636" font-size="10.5" fill="#222222">agent task delegation / result</text>
  <line x1="45" y1="652" x2="80" y2="652" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="88" y="656" font-size="10.5" fill="#222222">tool call / data read-write</text>
</svg>
